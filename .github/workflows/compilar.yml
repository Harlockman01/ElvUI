name: Compilar ElvUI v14.03 Especial

on:
  workflow_dispatch: # Activa el botón manual

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar v14.03 directamente de Tukui
        uses: actions/checkout@v4
        with:
          repository: 'tukui-org/ElvUI'
          ref: 'refs/tags/v14.03'
          fetch-depth: 0

      - name: Empaquetar Addon (Inyectar librerías)
        uses: BigWigsMods/packager@v2

      - name: Subir archivo comprimido listo
        uses: actions/upload-artifact@v4
        with:
          name: ElvUI-v14.03-Listo
          path: "**/*.zip" # <-- Esta ruta buscará cualquier archivo .zip en cualquier carpeta generada
