name: Compilar ElvUI v14.03 Especial

on:
  workflow_dispatch: # Activa el botón manual

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar v14.03 directamente de Tukui
        uses: actions/checkout@v4
        with:
          repository: 'tukui-org/ElvUI' # <-- Cambiamos tu repositorio por el original
          ref: 'refs/tags/v14.03'       # <-- Aquí sí va a encontrar la etiqueta oficial
          fetch-depth: 0

      - name: Empaquetar Addon (Inyectar librerías)
        uses: BigWigsMods/packager@v2

      - name: Subir archivo comprimido listo
        uses: actions/upload-artifact@v4
        with:
          name: ElvUI-v14.03-Listo
          path: ./.shadow-images/*.zip
